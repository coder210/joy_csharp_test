name: Windows Build & Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    name: Windows x64 (MSVC + CoreCLR)
    runs-on: windows-latest

    steps:
      # joy 引擎以 git 子模块 third_party/joy 引入（提交号固定在本仓 gitlink 里）
      - name: Checkout (with joy submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 子模块按 gitlink 指定的提交 checkout，完整历史避免浅克隆取不到
          fetch-depth: 0

      - name: Show joy submodule commit
        shell: pwsh
        run: git -C third_party/joy log --oneline -1

      - name: Setup Node.js (binding API contract)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check binding API contract
        # joy 的 api/idl/joy.idl + coverage.md + generated/jmath_wrappers.{h,c}
        # 是入库的生成物；此处只校验不写文件，防止改了契约头 / IDL 却忘记
        # 重新生成，也防止手改生成物。
        shell: pwsh
        run: node third_party/joy/api/tools/gen_bindings.js --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# binding + game assemblies
        # JoyGame.csproj 通过 ProjectReference 引用 joy 的 Joy.Bindings.csproj；
        # 显式构建一次绑定项目，确保 Joy.Bindings.dll 落在 build/csharp/，
        # 供 CMake post-build 拷进 CLR 搜索路径 lib/。
        run: |
          dotnet build third_party/joy/modules/cs/Joy.Bindings.csproj -c Release -o build/csharp
          dotnet build csharp/JoyGame.csproj -c Release -o build/csharp

      - name: Configure CMake
        # 运行时由 joy 子模块 runtimes/ 提供（BCL/头共享，平台原生库在 <platform>/），无需 -DMONO_* 参数
        run: >
          cmake -S . -B build/app -A x64

      - name: Build host
        run: cmake --build build/app --config Release --parallel

      - name: Smoke test (headless)
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          $exe = "build/app/bin/Release/joy_csharp_test_app.exe"
          if (-not (Test-Path $exe)) { Write-Error "缺少 $exe"; exit 1 }
          $out = & $exe --smoke 180 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $out | Out-File -FilePath smoke.log -Encoding utf8
          if ($code -ne 0) { Write-Error "冒烟失败，exit=$code"; exit $code }
          if (-not ($out -match '\[api\.cs\] PASS')) { Write-Error "未看到 [api.cs] PASS"; exit 1 }
          if (-not ($out -match '\[api\] lua selftest PASS')) { Write-Error "未看到 lua 自检 PASS"; exit 1 }
          if (-not ($out -match '\[api\] js selftest PASS')) { Write-Error "未看到 js 自检 PASS"; exit 1 }
          if (-not ($out -match '\[smoke\] PASS')) { Write-Error "未看到 [smoke] PASS"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: joy_csharp_test-windows-x64
          if-no-files-found: error
          path: |
            build/app/bin/Release/joy_csharp_test_app.exe
            build/app/bin/Release/JoyGame.dll
            build/app/bin/Release/coreclr.dll
            build/app/bin/Release/lib/**
            build/app/bin/Release/SDL3.dll
            build/app/bin/Release/msgpack-c.dll
            build/app/bin/Release/assets/**
            smoke.log
